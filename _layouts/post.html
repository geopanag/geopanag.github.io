<!DOCTYPE html>
<html lang="en" class="no-js">
    <head>
        <meta charset="UTF-8"/>
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>George Panagopoulos | Data Mining Researcher</title>
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
        <meta name="description" content="George Panagopoulos | Data Scientist"/>
        <meta name="keywords" content="George Panagopoulos"/>
        <meta name="author" content="giorgospanagopoulos"/>
        <link rel="shortcut icon" href="/favicon.ico">

        <link rel="stylesheet" href="/css/bootstrap.css">
        <link rel="stylesheet" href="/css/normalize.css">
        <link rel="stylesheet" href="/css/transition-animations.css">
        <link rel="stylesheet" href="/css/owl.carousel.css">
        <link rel="stylesheet" href="/css/magnific-popup.css">
        <link rel="stylesheet" href="/css/animate.css">
        <link rel="stylesheet" href="/css/main.css" type="text/css">

        <script src="/js/jquery-2.1.3.min.js"></script>
        <script src="/js/modernizr.custom.js"></script>
    </head>

    <body>
        <!-- Loading animation -->
        <div class="preloader">
            <div class="preloader-animation">
                <div class="dot1"></div>
                <div class="dot2"></div>
            </div>
        </div>
        <!-- /Loading animation -->

        <div id="page" class="page blog-post-page">

            {% include header.html %}
            <!-- Main Content -->
            <div id="main" class="site-main">
                <div class="page-wrapper">
                    <a class="blog-back-button" href="/index.html#blog"><i class="fa fa-angle-left"></i></a>
                    <div class="blog-post-main-image">
                    </div>
                    <div class="blog-post-content">
                        <h1>{{ page.title }}</h1>
                        <ul class="tags">
                            {% for tag in page.tags %}
                            <li><a>{{tag}}</a></li>
                            {% endfor %}
                        </ul>
                        {{ content }}
                        <div class="post-info">
                            <span class="autor"><i class="fa fa-fw fa-user"></i>George Panagopoulos</span>
                            <span class="divider">|</span>
                            <span class="date"><i class="fa fa-fw fa-clock-o"></i>{{ page.date | date_to_string }}</span>
                        </div>
                    </div>

                </div>
            </div>
            <!-- /Main Content -->
			<!-- Post comments -->
			<!--<div class="notecomments">
				{% include disqus.html %}	 
			</div>-->
        </div>
        <script src="/js/bootstrap.min.js"></script>
        <script src="/js/page-transition.js"></script>
        <script src="/js/imagesloaded.pkgd.min.js"></script>
        <script src="/js/validator.js"></script>
        <script src="/js/jquery.shuffle.min.js"></script>
        <script src="/js/masonry.pkgd.min.js"></script>
        <script src="/js/owl.carousel.min.js"></script>
        <script src="/js/jquery.magnific-popup.min.js"></script>
        <script src="/js/jquery.hoverdir.js"></script>
        <script src="/js/main.js"></script>

    </body>

</html>
